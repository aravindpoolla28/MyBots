name: BTC Straddle Standalone

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes

jobs:
  run-straddle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp numpy pandas matplotlib

      - name: Run straddle script
        run: |
          python straddle.py

      - name: Commit cache updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          echo "Listing cache files..."
          find . -maxdepth 2 \( \
            -name "ohlcv_cache.csv" -o \
            -name "ohlcv_cache_meta.json" -o \
            -name "premium_cache.json" -o \
            -name "mtm_cache.json" -o \
            -name "run_history.jsonl" \
          \) -print
      
          FILES=()
          for f in \
            "ain/ohlcv_cache.csv" \
            "ain/ohlcv_cache_meta.json" \
            "ain/premium_cache.json" \
            "ain/mtm_cache.json" \
            "ain/run_history.jsonl"
          do
            if [ -f "$f" ]; then
              FILES+=("$f")
            fi
          done
      
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No cache files found. Nothing to commit."
            exit 0
          fi
      
          git add -f "${FILES[@]}"
      
          if git diff --cached --quiet; then
            echo "No cache updates to commit."
          else
            git commit -m "Update straddle cache data"
            git push
          fi
